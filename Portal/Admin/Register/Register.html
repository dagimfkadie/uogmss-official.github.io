<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration</title>
  <link rel="stylesheet" href="Register.css">
  <script type="module" src="Register.js"></script>
</head>
<body>


<nav class="navbar">
  <div class="hamburger" id="hamburger">
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  </div>
    <img src="UoG_Logo.png" class="nav-logo">

    <ul class="nav-right">
          <li><a href="#" id="logoutBtnSidebar" class="tab-icon">🚪<span class="tab-text">Logout</span></a></li>
       
    </ul>
</nav>
  <header>
    <h1>Registeration</h1>

  </header>

  <main>
    <div class="sidebar" id="sidebar">
    <div class="sidebar-content">

        <ul class="sidebar-right-tabs">
            <li><a href="#" id="logoutBtn" class="tab-icon">🚪 Logout<span class="tab-text">Logout</span></a></li>
        </ul>
    </div>
</div>

    <div style="text-align: center;">
      <h3>Upload CSV for Bulk User Creation</h3>
      <input type="file" id="csvFileInput" accept=".csv">
      <button id="processCsvButton" onclick="processBulkUsers()">Process CSV</button>
    </div>
  
    <div style="text-align: center; margin-bottom: 40px;">
      <h3>Add New Student</h3>
      
      <label>Mode:</label>
      <select id="studentMode" onchange="toggleStudentInputs()">
        <option value="automatic">Automatic</option>
        <option value="manual">Manual</option>
      </select>

      <label>Use:</label>
      <select id="identifierType" onchange="toggleStudentInputs()">
        <option value="email">Email</option>
        <option value="username">Username</option>
      </select>

      <br><br>

      <input type="text" id="studentFirstName" placeholder="First Name">
      <input type="text" id="studentLastName" placeholder="Last Name">
      <input type="text" id="studentIdentifier" placeholder="Email or Username">
      <input type="password" id="studentPassword" placeholder="Password">

      <br><br>
      <button onclick="addStudent()">Add Student</button>
    </div>


    <div style="text-align: center; margin-bottom: 40px;">
      <h3>Add New Teacher</h3>

      <label>Mode:</label>
      <select id="teacherMode" onchange="toggleTeacherInputs()">
        <option value="automatic">Automatic</option>
        <option value="manual">Manual</option>
      </select>

      <label>Use:</label>
      <select id="teacherIdentifierType" onchange="toggleTeacherInputs()">
        <option value="email">Email</option>
        <option value="username">Username</option>
      </select>

      <br><br>

      <input type="text" id="teacherFirstName" placeholder="First Name">
      <input type="text" id="teacherLastName" placeholder="Last Name">
      <input type="text" id="teacherIdentifier" placeholder="Email or Username">
      <input type="password" id="teacherPassword" placeholder="Password">
      <input type="text" id="subject" placeholder="Subject">

      <br><br>
      <button onclick="addTeacher()">Add Teacher</button>
    </div>


    <div style="text-align: center; margin-bottom: 40px;">
      <h3>Add New Admin</h3>

      <label>Mode:</label>
      <select id="adminMode" onchange="toggleAdminInputs()">
        <option value="automatic">Automatic</option>
        <option value="manual">Manual</option>
      </select>

      <label>Use:</label>
      <select id="adminIdentifierType" onchange="toggleAdminInputs()">
        <option value="email">Email</option>
        <option value="username">Username</option>
      </select>

      <br><br>

      <input type="text" id="adminFirstName" placeholder="First Name">
      <input type="text" id="adminLastName" placeholder="Last Name">
      <input type="text" id="adminIdentifier" placeholder="Email or Username">
      <input type="password" id="adminPassword" placeholder="Password">

      <br><br>
      <button onclick="addAdmin()">Add Admin</button>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
  
  <script>
    function toggleStudentInputs() {
  const mode = document.getElementById("studentMode").value;
  const idInput = document.getElementById("studentIdentifier");
  const pwInput = document.getElementById("studentPassword");

  if (mode === "manual") {
    idInput.style.display = "inline";
    pwInput.style.display = "inline";
  } else {
    idInput.style.display = "none";
    pwInput.style.display = "none";
  }
}

function toggleTeacherInputs() {
  const mode = document.getElementById("teacherMode").value;
  const idInput = document.getElementById("teacherIdentifier");
  const pwInput = document.getElementById("teacherPassword");

  if (mode === "manual") {
    idInput.style.display = "inline";
    pwInput.style.display = "inline";
  } else {
    idInput.style.display = "none";
    pwInput.style.display = "none";
  }
}

function toggleAdminInputs() {
  const mode = document.getElementById("adminMode").value;
  const idInput = document.getElementById("adminIdentifier");
  const pwInput = document.getElementById("adminPassword");

  if (mode === "manual") {
    idInput.style.display = "inline";
    pwInput.style.display = "inline";
  } else {
    idInput.style.display = "none";
    pwInput.style.display = "none";
  }
}

window.onload = function() {
  toggleStudentInputs();
  toggleTeacherInputs();
  toggleAdminInputs();
};

  </script>

</body>
</html>
